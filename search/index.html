<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search | Joseph Kahn</title>
  <meta name="description" content="Search commercials, music videos, films, short films, and television by Joseph Kahn.">
  <link rel="canonical" href="https://joefilmfan.github.io/search/">
  <style>
    :root {
      --red: #f02610;
      --black: #000;
      --white: #fff;
      --muted: #666;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; border: 0; }
    html, body { width: 100%; min-height: 100%; }
    body {
      font-family: "futura-pt", Futura, "Trebuchet MS", "Century Gothic", "Gill Sans", "Gill Sans MT", sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--black);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap {
      width: calc(100% - 100px);
      max-width: 1600px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px 40px;
      flex-wrap: wrap;
      padding: 40px 0 28px;
    }
    .logo {
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.22em;
      line-height: 1;
      text-transform: uppercase;
      color: var(--black);
      white-space: nowrap;
    }
    .logo:hover { color: var(--red); }
    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 22px;
    }
    nav a {
      position: relative;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--black);
      padding-top: 6px;
    }
    nav a:before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 95%;
      height: 0;
      border-top: 2px solid var(--red);
      opacity: 0;
      transition: opacity 0.3s;
    }
    nav a:hover:before,
    nav a[aria-current="page"]:before { opacity: 1; }
    .search-panel { padding: 8px 0 22px; }
    .search-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    #q {
      background: transparent;
      border: 2px solid var(--red);
      color: var(--red);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 14px 16px;
      width: 100%;
      max-width: 640px;
      outline: none;
      border-radius: 0;
      -webkit-appearance: none;
    }
    #q::placeholder { color: #f0261080; text-transform: uppercase; }
    #count {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      padding: 20px 0 24px;
      align-items: center;
    }
    .chips .label {
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--red);
      margin-right: 4px;
    }
    .chip {
      background: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--black);
      cursor: pointer;
      position: relative;
      padding-top: 6px;
      line-height: 1.2;
    }
    .chip:before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 95%;
      border-top: 2px solid var(--red);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .chip:hover:before,
    .chip[aria-pressed="true"]:before { opacity: 1; }
    #results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      padding-bottom: 80px;
    }
    .card {
      position: relative;
      display: block;
      overflow: hidden;
      background: #111;
      color: var(--white);
    }
    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      object-position: center;
      display: block;
      vertical-align: middle;
    }
    .card .caption {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      color: var(--white);
      background: rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 2;
    }
    .card .infowrap {
      opacity: 0;
      transform: translateY(18px);
      transition: all 0.3s 0.05s;
      position: relative;
      z-index: 3;
    }
    .card .slice {
      position: absolute;
      left: -20%;
      bottom: -50%;
      width: 200%;
      height: 50%;
      background: rgba(240, 38, 16, 0.5);
      transform-origin: bottom left;
      transform: rotate(0deg);
      transition: all 0.3s;
      z-index: 1;
      pointer-events: none;
    }
    .card:hover .caption,
    .card:focus-visible .caption { opacity: 1; }
    .card:hover .infowrap,
    .card:focus-visible .infowrap {
      opacity: 1;
      transform: translateY(0);
    }
    .card:hover .slice,
    .card:focus-visible .slice {
      bottom: 0;
      transform: rotate(13deg);
    }
    .card h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .card h3 {
      font-size: 16px;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.06em;
      line-height: 1.3;
      text-transform: none;
    }
    .card .cat {
      display: block;
      margin-top: 10px;
      font-size: 10px;
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .empty {
      grid-column: 1 / -1;
      padding: 60px 0;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .error { color: var(--red); }
    @media (max-width: 900px) {
      #results { grid-template-columns: repeat(2, 1fr); }
      .card h2 { font-size: 16px; letter-spacing: 0.2em; }
      .card h3 { font-size: 14px; }
    }
    @media (max-width: 720px) {
      .wrap { width: calc(100% - 36px); }
      header { padding: 24px 0 18px; }
      .logo { font-size: 16px; letter-spacing: 0.16em; }
      nav ul { justify-content: flex-start; gap: 8px 16px; }
      #results { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="https://www.josephkahn.com">Joseph Kahn</a>
      <nav aria-label="Site">
        <ul>
          <li><a href="https://www.josephkahn.com/featured">Work</a></li>
          <li><a href="https://www.josephkahn.com/press">Press</a></li>
          <li><a href="https://www.josephkahn.com/bio">Bio</a></li>
          <li><a href="https://www.josephkahn.com/contact">Contact</a></li>
          <li><a href="https://www.ebay.com/usr/supermegapictures" target="_blank" rel="noopener">Shop</a></li>
          <li><a href="./" aria-current="page">Search</a></li>
        </ul>
      </nav>
    </header>

    <section class="search-panel">
      <div class="search-row">
        <label class="search-label" for="q">Search projects</label>
        <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" autofocus>
        <div id="count"></div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by category">
        <span class="label">Filter</span>
      </div>
    </section>

    <main id="results" aria-live="polite"></main>
  </div>

  <script>
(function () {
  "use strict";

  var CATEGORIES = [
    { slug: "all", label: "All" },
    { slug: "featured", label: "Featured" },
    { slug: "commercials", label: "Commercials" },
    { slug: "music-videos", label: "Music Videos" },
    { slug: "films", label: "Films" },
    { slug: "short-films", label: "Short Films" },
    { slug: "tv", label: "TV" }
  ];

  var state = { projects: [], query: "", category: "all" };
  var resultsEl = document.getElementById("results");
  var countEl = document.getElementById("count");
  var inputEl = document.getElementById("q");
  var chipsEl = document.getElementById("chips");

  function norm(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/&/g, " and ")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  function subsequence(hay, needle) {
    var i = 0;
    for (var n = 0; n < hay.length && i < needle.length; n++) {
      if (hay.charAt(n) === needle.charAt(i)) i++;
    }
    return i === needle.length;
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    if (Math.abs(a.length - b.length) > 2) return 99;
    var prev = [];
    var curr = [];
    var i, j;
    for (j = 0; j <= a.length; j++) prev[j] = j;
    for (i = 1; i <= b.length; i++) {
      curr[0] = i;
      for (j = 1; j <= a.length; j++) {
        curr[j] = b.charAt(i - 1) === a.charAt(j - 1)
          ? prev[j - 1]
          : 1 + Math.min(prev[j - 1], prev[j], curr[j - 1]);
      }
      var tmp = prev; prev = curr; curr = tmp;
    }
    return prev[a.length];
  }

  function fieldScore(field, q, weight) {
    if (!field) return 0;
    if (field === q) return weight;
    var words = field.split(" ");
    var wi;
    for (wi = 0; wi < words.length; wi++) {
      if (words[wi] === q) return weight * 0.96;
    }
    if (field.startsWith(q)) return weight * 0.9;
    for (wi = 0; wi < words.length; wi++) {
      if (words[wi].startsWith(q)) return weight * 0.85;
    }
    if (field.indexOf(q) !== -1) return weight * 0.55;
    var qtokens = q.split(" ").filter(Boolean);
    var ok = 0;
    var t, f, ts, ti, fi;
    for (ti = 0; ti < qtokens.length; ti++) {
      t = qtokens[ti];
      ts = 0;
      for (fi = 0; fi < words.length; fi++) {
        f = words[fi];
        if (f === t) ts = Math.max(ts, 1);
        else if (f.startsWith(t) || t.startsWith(f) && f.length >= 3) ts = Math.max(ts, 0.85);
        else if (t.length >= 3 && f.indexOf(t) !== -1) ts = Math.max(ts, 0.6);
        else if (t.length >= 3 && levenshtein(f, t) === 1) ts = Math.max(ts, 0.7);
        else if (t.length >= 4 && subsequence(f, t)) ts = Math.max(ts, 0.4);
      }
      if (ts === 0) return 0;
      ok += ts;
    }
    return weight * 0.5 * (ok / qtokens.length);
  }

  function scoreProject(p, query) {
    var q = norm(query);
    if (!q) return 1;
    var title = norm(p.title);
    var artist = norm(p.artist);
    var cats = norm((p.categories || []).join(" "));
    var slug = norm((p.slug || "").replace(/-/g, " "));
    var hay = [title, artist, cats, slug].filter(Boolean).join(" ");
    return Math.max(
      fieldScore(title, q, 100),
      fieldScore(artist, q, 110),
      fieldScore(slug, q, 80),
      fieldScore(cats, q, 45),
      fieldScore(hay, q, 40)
    );
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function readParams() {
    var params = new URLSearchParams(window.location.search);
    state.query = params.get("q") || "";
    var cat = (params.get("cat") || "all").toLowerCase();
    var known = false;
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].slug === cat) known = true;
    }
    state.category = known ? cat : "all";
    inputEl.value = state.query;
  }

  function writeParams() {
    var params = new URLSearchParams();
    if (state.query) params.set("q", state.query);
    if (state.category && state.category !== "all") params.set("cat", state.category);
    var qs = params.toString();
    var next = qs ? "?" + qs : window.location.pathname;
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, "", next);
    }
  }

  function renderChips() {
    CATEGORIES.forEach(function (cat) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.textContent = cat.label;
      btn.setAttribute("aria-pressed", cat.slug === state.category ? "true" : "false");
      btn.addEventListener("click", function () {
        state.category = cat.slug;
        writeParams();
        renderChipsState();
        render();
      });
      chipsEl.appendChild(btn);
    });
  }

  function renderChipsState() {
    var buttons = chipsEl.querySelectorAll(".chip");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-pressed", CATEGORIES[i].slug === state.category ? "true" : "false");
    }
  }

  function fallbackThumb(img) {
    var full = img.getAttribute("data-full");
    if (full && img.src !== full) {
      img.src = full;
    }
  }

  function render() {
    var q = state.query;
    var scored = [];
    for (var i = 0; i < state.projects.length; i++) {
      var p = state.projects[i];
      if (state.category !== "all") {
        var slugs = p.category_slugs || [];
        if (slugs.indexOf(state.category) === -1) continue;
      }
      var s = scoreProject(p, q);
      if (s > 0) scored.push({ p: p, s: s, i: i });
    }
    scored.sort(function (a, b) {
      if (b.s !== a.s) return b.s - a.s;
      return a.i - b.i;
    });

    var total = state.projects.length;
    var noun = scored.length === 1 ? "PROJECT" : "PROJECTS";
    if (q || state.category !== "all") {
      countEl.textContent = scored.length + " OF " + total + " " + noun;
    } else {
      countEl.textContent = scored.length + " " + noun;
    }

    resultsEl.innerHTML = "";
    if (!scored.length) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No projects match.";
      resultsEl.appendChild(empty);
      return;
    }

    var frag = document.createDocumentFragment();
    for (var j = 0; j < scored.length; j++) {
      var item = scored[j].p;
      var a = document.createElement("a");
      a.className = "card";
      a.href = item.url;
      var primary = item.artist || item.title || "Untitled";
      var secondary = item.artist ? item.title : "";
      var label = [item.artist, item.title].filter(Boolean).join(" — ") || "Untitled";
      a.setAttribute("aria-label", label);
      var img = document.createElement("img");
      img.alt = label;
      img.loading = "lazy";
      img.decoding = "async";
      img.src = item.thumbnail || item.thumbnail_full || "";
      if (item.thumbnail_full) img.setAttribute("data-full", item.thumbnail_full);
      img.addEventListener("error", function (ev) { fallbackThumb(ev.target); });
      var caption = document.createElement("div");
      caption.className = "caption";
      var info = document.createElement("div");
      info.className = "infowrap";
      info.innerHTML =
        "<h2>" + escapeHtml(primary) + "</h2>" +
        (secondary ? "<h3>" + escapeHtml(secondary) + "</h3>" : "") +
        '<span class="cat">' + escapeHtml((item.categories || []).join(" / ")) + "</span>";
      var slice = document.createElement("figure");
      slice.className = "slice";
      caption.appendChild(info);
      a.appendChild(img);
      a.appendChild(caption);
      a.appendChild(slice);
      frag.appendChild(a);
    }
    resultsEl.appendChild(frag);
  }

  var timer = null;
  inputEl.addEventListener("input", function () {
    var value = inputEl.value;
    if (timer) window.clearTimeout(timer);
    timer = window.setTimeout(function () {
      state.query = value;
      writeParams();
      render();
    }, 40);
  });
  inputEl.addEventListener("search", function () {
    state.query = inputEl.value;
    writeParams();
    render();
  });

  readParams();
  renderChips();

  fetch("projects.json")
    .then(function (res) {
      if (!res.ok) throw new Error("Could not load projects.json");
      return res.json();
    })
    .then(function (data) {
      state.projects = data.projects || [];
      render();
    })
    .catch(function (err) {
      resultsEl.innerHTML = '<p class="empty error">Could not load the project index.</p>';
      countEl.textContent = "";
      console.error(err);
    });
})();
  </script>
</body>
</html>
