    var body = document.body;
    var btn = document.querySelector(".menuBtn");
    var closer = document.querySelector("#overlay .closeoverlay");
    function toggle() { body.classList.toggle("menu"); }
    if (btn) {
      btn.addEventListener("click", toggle);
      btn.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    }
    if (closer) closer.addEventListener("click", toggle);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && body.classList.contains("menu")) {
        body.classList.remove("menu");
      }
    });
  });
})();


(function () {
  "use strict";

  var state = { projects: [], query: "" };
  var resultsEl = document.getElementById("thumbs");
  var inputEl = document.getElementById("q");

  function norm(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/&/g, " and ")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  function subsequence(hay, needle) {
    var i = 0;
    for (var n = 0; n < hay.length && i < needle.length; n++) {
      if (hay.charAt(n) === needle.charAt(i)) i++;
    }
    return i === needle.length;
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    if (Math.abs(a.length - b.length) > 2) return 99;
    var prev = [];
    var curr = [];
    var i, j;
    for (j = 0; j <= a.length; j++) prev[j] = j;
    for (i = 1; i <= b.length; i++) {
      curr[0] = i;
      for (j = 1; j <= a.length; j++) {
        curr[j] = b.charAt(i - 1) === a.charAt(j - 1)
          ? prev[j - 1]
          : 1 + Math.min(prev[j - 1], prev[j], curr[j - 1]);
      }
      var tmp = prev; prev = curr; curr = tmp;
    }
    return prev[a.length];
  }

  function fieldScore(field, q, weight) {
    if (!field) return 0;
    if (field === q) return weight;
    var words = field.split(" ");
    var wi;
    for (wi = 0; wi < words.length; wi++) {
      if (words[wi] === q) return weight * 0.96;
    }
    if (field.startsWith(q)) return weight * 0.9;
    for (wi = 0; wi < words.length; wi++) {
      if (words[wi].startsWith(q)) return weight * 0.85;
    }
    if (field.indexOf(q) !== -1) return weight * 0.55;
    var qtokens = q.split(" ").filter(Boolean);
    var ok = 0;
    var t, f, ts, ti, fi;
    for (ti = 0; ti < qtokens.length; ti++) {
      t = qtokens[ti];
      ts = 0;
      for (fi = 0; fi < words.length; fi++) {
        f = words[fi];
        if (f === t) ts = Math.max(ts, 1);
        else if (f.startsWith(t) || (t.startsWith(f) && f.length >= 3)) ts = Math.max(ts, 0.85);
        else if (t.length >= 3 && f.indexOf(t) !== -1) ts = Math.max(ts, 0.6);
        else if (t.length >= 3 && levenshtein(f, t) === 1) ts = Math.max(ts, 0.7);
        else if (t.length >= 4 && subsequence(f, t)) ts = Math.max(ts, 0.4);
      }
      if (ts === 0) return 0;
      ok += ts;
    }
    return weight * 0.5 * (ok / qtokens.length);
  }

  function scoreProject(p, query) {
    var q = norm(query);
    if (!q) return 0;
    var title = norm(p.title);
    var artist = norm(p.artist);
    var cats = norm((p.categories || []).join(" "));
    var slug = norm((p.slug || "").replace(/-/g, " "));
    var hay = [title, artist, cats, slug].filter(Boolean).join(" ");
    return Math.max(
      fieldScore(title, q, 100),
      fieldScore(artist, q, 110),
      fieldScore(slug, q, 80),
      fieldScore(cats, q, 45),
      fieldScore(hay, q, 40)
    );
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function readParams() {
    var params = new URLSearchParams(window.location.search);
    state.query = params.get("q") || "";
    inputEl.value = state.query;
  }

  function writeParams() {
    var params = new URLSearchParams();
    if (state.query) params.set("q", state.query);
    var qs = params.toString();
    var next = qs ? "?" + qs : window.location.pathname;
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, "", next);
    }
  }

  function fallbackThumb(img) {
    var full = img.getAttribute("data-full");
    if (full && img.src !== full) {
      img.src = full;
    }
  }

  function packRows(items) {
    var rows = [];
    var per = 3;
    for (var i = 0; i < items.length; i += per) {
      rows.push(items.slice(i, i + per));
    }
    return rows;
  }

  function justifyRows() {
    var thumbs = resultsEl;
    if (!thumbs) return;
    var mobile = window.innerWidth <= 767;
    var containerWidth = mobile ? window.innerWidth : window.innerWidth - 100;
    var rows = thumbs.querySelectorAll(".row");
    var r, i, cells, img, ow, oh, ratio, firstH, ww, total, percentage, rel, newHeight;
    for (r = 0; r < rows.length; r++) {
      cells = rows[r].querySelectorAll(".cell");
      if (!cells.length) continue;
      if (mobile) {
        for (i = 0; i < cells.length; i++) {
          cells[i].style.width = "";
          img = cells[i].querySelector("img.photo");
          if (img) img.style.height = "";
        }
        continue;
      }
      firstH = parseFloat(cells[0].querySelector("img.photo").getAttribute("data-height")) || 9;
      total = 0;
      var working = [];
      for (i = 0; i < cells.length; i++) {
        img = cells[i].querySelector("img.photo");
        ow = parseFloat(img.getAttribute("data-width")) || 16;
        oh = parseFloat(img.getAttribute("data-height")) || 9;
        ratio = oh / ow;
        ww = firstH / ratio;
        working.push({ ratio: ratio });
        total += ww;
        working[i].ww = ww;
      }
      for (i = 0; i < cells.length; i++) {
        percentage = working[i].ww / total;
        rel = percentage * containerWidth;
        newHeight = rel * working[i].ratio;
        cells[i].style.width = rel + "px";
        img = cells[i].querySelector("img.photo");
        if (img) img.style.height = newHeight + "px";
      }
    }
  }

  function render() {
    var q = (state.query || "").trim();
    resultsEl.innerHTML = "";
    if (!q) return;

    var scored = [];
    for (var i = 0; i < state.projects.length; i++) {
      var p = state.projects[i];
      var s = scoreProject(p, q);
      if (s > 0) scored.push({ p: p, s: s, i: i });
    }
    scored.sort(function (a, b) {
      if (b.s !== a.s) return b.s - a.s;
      return a.i - b.i;
    });

    if (!scored.length) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No projects match.";
      resultsEl.appendChild(empty);
      return;
    }

    var rows = packRows(scored);
    var frag = document.createDocumentFragment();
    for (var r = 0; r < rows.length; r++) {
      var figure = document.createElement("figure");
      figure.className = "row";
      for (var j = 0; j < rows[r].length; j++) {
        var item = rows[r][j].p;
        var a = document.createElement("a");
        a.className = "cell";
        a.href = item.url;
        var primary = item.artist || item.title || "Untitled";
        var secondary = item.artist ? (item.title || "") : "";
        var label = [item.artist, item.title].filter(Boolean).join(" — ") || "Untitled";
        a.setAttribute("aria-label", label);
        var img = document.createElement("img");
        img.className = "photo";
        img.alt = label;
        img.loading = "lazy";
        img.decoding = "async";
        img.src = item.thumbnail || item.thumbnail_full || "";
        img.setAttribute("data-width", item.width || 16);
        img.setAttribute("data-height", item.height || 9);
        if (item.thumbnail_full) img.setAttribute("data-full", item.thumbnail_full);
        img.addEventListener("error", function (ev) { fallbackThumb(ev.target); });
        var caption = document.createElement("div");
        caption.className = "caption ib addb4";
        var info = document.createElement("div");
        info.className = "infowrap ib v-middle";
        info.innerHTML =
          "<h1>" + escapeHtml(primary) + "</h1>" +
          (secondary ? "<h2>" + escapeHtml(secondary) + "</h2>" : "");
        var slice = document.createElement("figure");
        slice.className = "slice";
        caption.appendChild(info);
        a.appendChild(img);
        a.appendChild(caption);
        a.appendChild(slice);
        figure.appendChild(a);
      }
      frag.appendChild(figure);
    }
    resultsEl.appendChild(frag);
    justifyRows();
  }

  var timer = null;
  inputEl.addEventListener("input", function () {
    var value = inputEl.value;
    if (timer) window.clearTimeout(timer);
    timer = window.setTimeout(function () {
      state.query = value;
      writeParams();
      render();
    }, 40);
  });
  inputEl.addEventListener("search", function () {
    state.query = inputEl.value;
    writeParams();
    render();
  });

  window.addEventListener("resize", function () {
    justifyRows();
  });

  readParams();

  fetch("projects.json")
    .then(function (res) {
      if (!res.ok) throw new Error("Could not load projects.json");
      return res.json();
    })
    .then(function (data) {
      state.projects = data.projects || [];
      render();
    })
    .catch(function (err) {
      resultsEl.innerHTML = '<p class="empty error">Could not load the project index.</p>';
      console.error(err);
    });
})();

</script>
</body>
</html>
